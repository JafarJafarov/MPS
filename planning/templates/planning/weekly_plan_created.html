<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">

    <title>
        MPS | Həftə yaradıldı
    </title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        .success {
            background: #eaf7ee;
            padding: 20px;
            border-radius: 8px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            margin-right: 10px;
            padding: 10px 18px;
            background: #1f4e78;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="success">

        <h1>Həftə uğurla yaradıldı</h1>

        <p>
            <strong>Proqram:</strong>
            {{ weekly_plan.name }}
        </p>

        <p>
            <strong>Həftə:</strong>
            W{{ weekly_plan.week_number }}-{{ weekly_plan.year }}
        </p>

        <p>
            <strong>Tarix:</strong>

            {{ weekly_plan.start_date|date:"d.m.Y" }}

            -

            {{ weekly_plan.end_date|date:"d.m.Y" }}
        </p>

        <p>
            <strong>Status:</strong>
            {{ weekly_plan.get_status_display }}
        </p>

    </div>


    <a
        class="button"
        href="{% url 'capacity:capacity_import' %}"
    >
        Bu həftəyə Capacity yüklə
    </a>


    <a
        class="button"
        href="{% url 'planning:weekly_plan_list' %}"
    >
        Həftələrə bax
    </a>

</div>

</body>
</html>
